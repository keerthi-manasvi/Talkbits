{% extends 'app/layout.html' %}
{% block title %}Lessons {% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">{{ language }} - Unit {{ unit }} Lessons</h2>
<h3 class="text-1xl font-bold mb-4">Score: {{score}}</h3>
<p class="mb-4">Finish excercises to increase score!</p>
<ul class="space-y-2">
    {% for lesson in lessons %}
    <li>
        <a href="{% url 'lesson_detail' language unit forloop.counter %}"
            class="block bg-white p-4 rounded shadow hover:bg-white-50 font-medium text-white-700">
            {{ lesson.title }}
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
