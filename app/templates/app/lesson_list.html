{% extends 'app/layout.html' %}
{% block title %}Lessons {% endblock %}
{% block content %}
<div class="min-h-[75vh] bg-cream py-16 px-6 sm:px-10 max-w-7xl mx-auto">
    <div class="reveal-left mb-10">
        <h2 class="font-display uppercase text-3xl sm:text-4xl">
            <span class="text-brand-red">{{ language }}</span>
        </h2>
        <p class="font-display uppercase text-xl text-brand-yellow">Unit {{ unit }} Lessons</p>
    </div>

    <ul class="flex flex-col gap-4 max-w-sm">
        {% for lesson in lessons %}
        <li class="bg-brand-red text-cream p-6 rounded-lg shadow card-lift reveal-up">
            <p class="font-display uppercase text-sm mb-1">Lesson {{ forloop.counter }}</p>
            <p class="mb-4 font-medium">{{ lesson.title }}</p>
            <a href="{% url 'lesson_detail' language unit forloop.counter %}" class="btn-start uppercase text-sm">
                Start Lesson
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
