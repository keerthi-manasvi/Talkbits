{% extends 'app/layout.html' %}
{% block title %}Successfully Registered {% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh] text-center px-6">

    <div class="bg-white shadow-lg rounded-2xl p-8 max-w-lg">
        <h1 class="text-3xl font-bold text-white-600 mb-4"> Registration Successful!</h1>

        <p class="text-amber-700 mb-6">
            You’ve successfully registered to learn
            <span class="font-semibold text-indigo-700">{{ language }}</span>.
        </p>

        <a href="{% url 'unit_list' language %}"
            class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
            Go to {{ language }} Course
        </a>
    </div>

</div>
{% endblock %}
