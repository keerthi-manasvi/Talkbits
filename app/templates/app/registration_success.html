{% extends 'app/layout.html' %}
{% block title %}Successfully Registered {% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh] text-center px-6">

    <div class="tb-pop bg-white shadow-lg rounded-2xl p-10 max-w-lg">
        <h1 class="font-display font-extrabold text-3xl text-tb-brown mb-1">SUCCESSFULLY</h1>
        <p class="font-display font-extrabold text-3xl mb-6">
            Joined <span class="text-tb-red">{{ language }}</span>!
        </p>

        <a href="{% url 'unit_list' language %}"
            class="tb-btn-pill inline-block bg-tb-yellow text-tb-brown font-bold px-8 py-3 rounded-full shadow hover:bg-tb-red hover:text-white tb-focus">
            Start Learning
        </a>
    </div>

</div>
{% endblock %}
