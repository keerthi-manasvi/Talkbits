{% extends "app/layout.html" %}

{% block title %}Log Out {% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center bg-cream py-12 px-4">
    <div class="max-w-md w-full space-y-8 text-center reveal-up">

        <!-- Error/Logout Message -->
        {% if messages %}
        <div class="bg-brand-red/10 border border-brand-red text-brand-red px-4 py-3 rounded-md text-center mx-auto">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Logout Confirmation -->
        <p class="font-display uppercase text-xl text-brand-brown mt-4">You've been successfully logged out!</p>

        <a href="{% url 'signin' %}" class="btn-cta uppercase text-sm inline-block">Sign In Again</a>

    </div>
</div>
{% endblock %}
