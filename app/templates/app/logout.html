{% extends "app/layout.html" %}

{% block title %}Log Out {% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-white-50 to-emerald-100 py-12 px-4">
    <div class="max-w-md w-full space-y-8 text-center">
        <!-- Illustration -->
        <div class="flex justify-center">
            <div class="w-24 h-24 bg-white-600 rounded-full flex items-center justify-center mb-6">
                <span class="text-4xl">logo</span>
            </div>
        </div>

        <!-- Error/Logout Message -->
        {% if messages %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-md text-center mx-auto">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Logout Confirmation -->
        <p class="text-lg font-medium mt-4">You've been successfully logged out!</p>

    </div>
</div>
{% endblock %}
