{% extends "app/layout.html" %}

{% block title %}Log Out {% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full space-y-6 text-center tb-fade-up">

        <!-- Error/Logout Message -->
        {% if messages %}
        <div class="bg-red-100 border border-tb-red text-tb-red-dark px-4 py-3 rounded-md text-center mx-auto">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Logout Confirmation -->
        <div class="bg-white rounded-2xl shadow-md p-8">
            <p class="font-display font-bold text-xl text-tb-brown">You've been successfully logged out!</p>
            <a href="{% url 'signin' %}"
                class="tb-btn-pill inline-block mt-6 bg-tb-yellow text-tb-brown font-bold px-6 py-3 rounded-full shadow hover:bg-tb-red hover:text-white tb-focus">
                Sign In Again
            </a>
        </div>

    </div>
</div>
{% endblock %}
