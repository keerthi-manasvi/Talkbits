{% extends 'app/layout.html' %}
{% block title %}Exercises{% endblock %}
{% load static %}

{% block content %}
<!-- Metadata for the JS engine -->
<div id="exercise-meta"
     data-language="{{ language }}"
     data-unit="{{ unit }}"
     data-lesson="{{ lesson }}"
     data-submit-url="{% url 'submit_exercises' language unit lesson %}"
     style="display:none;"></div>

<!-- Exercise payload: safe -- answer keys were stripped server-side before
     this was ever rendered (see app/views.py:_public_exercise). -->
<script id="exercises-data" type="application/json">{{ exercises_json|safe }}</script>

<h2 class="text-2xl font-bold mb-4 text-amber-900">Exercises for Lesson {{ lesson }}</h2>

<div id="exercise-root" class="space-y-4"></div>

<button id="submit-exercises-btn" type="button"
        class="mt-6 bg-yellow-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-yellow-700 transition">
    Submit Exercises
</button>

<a href="{% url 'lesson_detail' language unit lesson %}" class="inline-block mt-4 text-amber-700 hover:underline">
    ← Back to Lesson
</a>

<!-- Score popup modal -->
<div id="score-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center transform transition-all">
        <h3 class="text-xl font-bold text-amber-900 mb-1">Lesson Complete!</h3>
        <p class="text-4xl font-extrabold text-emerald-600 my-3"><span id="score-modal-percent">0</span>%</p>
        <p id="score-modal-detail" class="text-amber-700 mb-5">0 / 0 correct</p>
        <button id="score-modal-close" class="bg-amber-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-amber-700">
            Continue
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'exercise-engine.js' %}"></script>
{% endblock %}
