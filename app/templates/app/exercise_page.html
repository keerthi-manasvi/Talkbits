{% extends 'app/layout.html' %}
{% block title %}Exercises{% endblock %}
{% load static %}

{% block content %}
<!-- Metadata for the JS engine -->
<div id="exercise-meta"
     data-language="{{ language }}"
     data-unit="{{ unit }}"
     data-lesson="{{ lesson }}"
     data-submit-url="{% url 'submit_exercises' language unit lesson %}"
     style="display:none;"></div>


<script id="exercises-data" type="application/json">{{ exercises_json|safe }}</script>

<div class="min-h-[75vh] bg-cream py-16 px-6 sm:px-10 max-w-3xl mx-auto">

    <h2 class="font-display uppercase text-3xl sm:text-4xl mb-1">
        <span class="text-brand-yellow">Exercise</span>
    </h2>
    <p class="text-brand-brown/70 mb-8 ">Lesson {{ lesson }}</p>

    <div id="exercise-root" class="space-y-4 "></div>

    <button id="submit-exercises-btn" type="button" class="btn-cta uppercase text-sm sm:text-base mt-8">
        Submit Exercises
    </button>

    <a href="{% url 'lesson_detail' language unit lesson %}" class="inline-block m-4 text-brand-brown hover:text-brand-red hover:underline transition-colors">
        &larr; Back to Lesson
    </a>
</div>

<!-- Score popup modal -->
<div id="score-modal" class="fixed inset-0 bg-brand-brown/50 hidden items-center justify-center z-50 px-4">
    <div class="bg-cream rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center transform transition-all">
        <p id="score-modal-emoji" class="text-4xl mb-2"></p>
        <h3 class="font-display uppercase text-xl text-brand-brown mb-1">Lesson Complete!</h3>
        <p class="text-4xl font-extrabold text-brand-red my-3"><span id="score-modal-percent">0</span>%</p>
        <p id="score-modal-detail" class="text-brand-brown/70 mb-6">0 / 0 correct</p>
        <button id="score-modal-close" class="btn-cta uppercase text-sm">
            <a href="{% url 'lesson_list' language unit %}" class="inline-block m-4 text-brand-brown hover:text-brand-red hover:underline transition-colors">
        &larr; Continue
    </a>
        </button>
        
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'exercise-engine.js' %}"></script>
{% endblock %}
