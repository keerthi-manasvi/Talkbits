{% extends 'app/layout.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center bg-cream py-16 px-4">
    <div class="max-w-2xl w-full reveal-up">
        <form method="post" class="space-y-8">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Readonly box showing language to learn -->
                <div class="text-left">
                    <label class="block text-brand-brown font-semibold mb-2 text-sm uppercase tracking-wide">Language you Want to Join</label>
                    <input type="text" value="{{ language }}" readonly
                        class="w-full border-2 border-brand-brown/20 rounded-lg px-4 py-3 bg-white text-brand-brown font-semibold cursor-not-allowed">
                    <!-- Hidden input for submitting -->
                    {{ form.learning_language }}
                </div>

                <!-- Dropdown for known language -->
                <div class="text-left">
                    <label class="block text-brand-brown font-semibold mb-2 text-sm uppercase tracking-wide">Your Language</label>
                    {{ form.known_language }}
                </div>
            </div>

            <div class="flex justify-center">
                <button type="submit" class="btn-cta uppercase text-sm sm:text-base">
                    Join
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
