<form method="post" class="space-y-5">
    {% csrf_token %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <!-- Readonly box showing language to learn -->
        <div>
            <label class="block text-gray-700 font-semibold mb-1">Language to Learn</label>
            <input type="text" value="{{ language }}" readonly
                class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-gray-100 text-gray-700 cursor-not-allowed">
            <!-- Hidden input for submitting -->
            {{ form.learning_language }}
        </div>

        <!-- Dropdown for known language -->
        <div>
            <label class="block text-gray-700 font-semibold mb-1">Language You Know</label>
            {{ form.known_language }}
        </div>
    </div>

    <div class="flex justify-center">
        <button type="submit"
            class="bg-indigo-600 text-white font-medium px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
            Register
        </button>
    </div>
</form>
