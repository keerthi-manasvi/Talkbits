{% extends 'app/layout.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-lg w-full tb-fade-up">
        <div class="bg-white rounded-2xl shadow-md p-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Readonly box showing language to learn -->
                    <div>
                        <label class="block text-tb-brown/70 text-xs font-bold uppercase tracking-wide mb-2">Language
                            you Want to Join</label>
                        <input type="text" value="{{ language }}" readonly
                            class="w-full border border-tb-brown/15 rounded-lg px-3 py-2 bg-cream text-tb-brown cursor-not-allowed">
                        <!-- Hidden input for submitting -->
                        {{ form.learning_language }}
                    </div>

                    <!-- Dropdown for known language -->
                    <div>
                        <label class="block text-tb-brown/70 text-xs font-bold uppercase tracking-wide mb-2">Your
                            Language</label>
                        {{ form.known_language }}
                    </div>
                </div>

                <div class="flex justify-center pt-2">
                    <button type="submit"
                        class="tb-btn-pill bg-tb-red text-white font-bold px-8 py-3 rounded-full shadow hover:bg-tb-yellow hover:text-tb-brown tb-focus">
                        Join
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
