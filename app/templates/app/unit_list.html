{% extends 'app/layout.html' %}
{% block title %}Units {% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-14">
    <h2 class="font-display font-extrabold text-3xl mb-1 tb-fade-up">
        <span class="text-tb-red">{{ language|upper }}</span>
    </h2>
    <p class="text-tb-yellow-dark font-display font-bold text-lg mb-8 tb-fade-up">Units</p>

    <div class="bg-white rounded-2xl shadow-md p-6 tb-fade-up">
        <span
            class="inline-block bg-tb-red text-white text-xs font-bold uppercase tracking-wide px-3 py-1 rounded-full mb-2">Unit
            1</span>
        <p class="mb-4 font-semibold text-tb-brown">Conversational Foundations</p>
        <a href="{% url 'lesson_list' language 1 %}"
            class="tb-btn-pill inline-block bg-tb-red text-white px-6 py-2 rounded-full font-bold shadow hover:bg-tb-yellow hover:text-tb-brown tb-focus">
            Start Lesson
        </a>
    </div>
</div>
{% endblock %}
