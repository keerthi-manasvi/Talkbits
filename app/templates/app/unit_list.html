{% extends 'app/layout.html' %}
{% block title %}Units {% endblock %}
{% block content %}
<div class="min-h-[75vh] bg-cream py-16 px-6 sm:px-10 max-w-7xl mx-auto">
    <div class="reveal-left mb-10">
        <h2 class="font-display uppercase text-3xl sm:text-4xl">
            <span class="text-brand-red">{{ language }}</span>
        </h2>
        <p class="font-display uppercase text-xl text-brand-yellow">Units</p>
    </div>

    <div class="bg-brand-red text-cream p-6 rounded-lg shadow max-w-sm card-lift reveal-up reveal-delay-1">
        <p class="font-display uppercase text-sm mb-1">Unit 1</p>
        <p class="mb-4 font-medium">Conversational Foundations</p>
        <a href="{% url 'lesson_list' language 1 %}" class="btn-start uppercase text-sm">
            Start Lessons
        </a>
    </div>
</div>
{% endblock %}
