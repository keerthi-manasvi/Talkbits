{% extends 'app/layout.html' %}

{% block title %}Course List{% endblock %}

{% block content %}
<!-- Messages -->
{% if messages %}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-md mb-8 max-w-lg mx-auto">
    {% for message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
</div>
{% endif %}


<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-white-50 to-emerald-100 py-12 px-4">
    <div class="max-w-md w-full text-center">
        
        <h2 class="text-2xl font-bold mb-6">Select a Language Course</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            {% for lang in languages %}
            <a href="{% url 'register' lang %}"
                class="bg-amber-300 shadow p-4 rounded text-center hover:bg-white-50 font-medium text-white-700">
                {{ lang }}
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
