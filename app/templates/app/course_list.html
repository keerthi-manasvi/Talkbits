{% extends 'app/layout.html' %}

{% block title %}Course List{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center bg-cream py-16 px-4">
    <div class="max-w-lg w-full text-center reveal-up">

        <h2 class="font-display uppercase text-3xl sm:text-4xl mb-10">
            <span class="text-brand-red">Join</span> <span class="text-brand-yellow">Language</span>
        </h2>

        <div class="flex flex-wrap justify-center gap-4">
            {% for lang in languages %}
            <a href="{% url 'register' lang %}" class="btn-pill min-w-[9rem] uppercase">
                {{ lang }}
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
